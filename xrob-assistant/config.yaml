name: XROB Assistant
description: Self-hosted personal dashboard for calendar, fitness, bills, documents and routines
version: 0.1.5
slug: xrob_assistant
init: false
startup: services
boot: auto
arch:
  - amd64
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Xrob Music web dashboard and local API
map:
  - addon_config:rw
options:
  telegram_bot_token: ""
  telegram_allowed_chat_id: ""
  timezone: Africa/Casablanca
schema:
  telegram_bot_token: str
  telegram_allowed_chat_id: str
  timezone: str

webui: "http://[HOST]:[PORT:8099]"
panel_icon: mdi:music
panel_title: Xrob Music
