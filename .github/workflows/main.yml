name: Build Xrob ConvertX

on:
  push:
    branches:
      - main
    paths:
      - "xrob-file-converter/**"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./xrob-file-converter
          file: ./xrob-file-converter/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/ahmedxrob/xrob-convertx:1.0.0
            ghcr.io/ahmedxrob/xrob-convertx:latest
