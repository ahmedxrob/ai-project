<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xrob Music Hub</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Main Header -->
        <header class="app-header">
            <div class="logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18V5l12-2v13"></path>
                    <circle cx="6" cy="18" r="3"></circle>
                    <circle cx="18" cy="16" r="3"></circle>
                </svg>
                <h1>Xrob Music</h1>
            </div>
            <div class="connection-status" id="connection-status">
                <span class="status-dot"></span> System Ready
            </div>
        </header>

        <!-- Main Content Layout -->
        <main class="main-layout">
            <!-- Left Column: Search & Discovery -->
            <section class="panel search-panel">
                <h2>Search & Discover</h2>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Search track, artist, or paste YouTube link..." autocomplete="off">
                    <button id="search-btn" class="btn-primary">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        Search
                    </button>
                </div>
                <div id="results-container" class="results-list">
                    <div class="empty-state">Search for music to start downloading or streaming previews.</div>
                </div>
            </section>

            <!-- Right Column: Queue & Downloads -->
            <section class="panel queue-panel">
                <h2>Download Queue</h2>
                <div id="tasks-container" class="tasks-list">
                    <div class="empty-state">No active or previous download tasks.</div>
                </div>
            </section>
        </main>

        <!-- Audio Player Bar -->
        <footer class="player-bar">
            <div class="player-info">
                <span id="player-status">Audio Preview Player</span>
            </div>
            <div class="player-controls">
                <audio id="audio-player" controls></audio>
            </div>
        </footer>
    </div>

    <script src="index.js"></script>
</body>
</html>
