<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-container">
    <header class="top-bar">
        <h1>Music Hub</h1>
        <nav class="nav-tabs">
            <button class="tab-btn active" data-tab="search">Search</button>
            <button class="tab-btn" data-tab="downloads">Downloads</button>
            <button class="tab-btn" data-tab="settings">Settings</button>
        </nav>
    </header>

    <main class="content-area">
        <!-- Search Section -->
        <section id="tab-search" class="tab-content active">
            <div class="search-box">
                <input
                    id="query"
                    type="text"
                    placeholder="Search tracks, artists, albums..."
                    autocomplete="off"
                    aria-label="Search music"
                />
                <button
                    id="searchBtn"
                    type="button"
                    onclick="searchMusic()"
                >
                    <span>Search</span>
                </button>
            </div>
            <div id="results" class="results-grid"></div>
        </section>

        <!-- Downloads Section -->
        <section id="tab-downloads" class="tab-content">
            <div id="progressPanel" class="progress-panel" style="display:none;">
                <h3>Active Downloads</h3>
                <div id="activeDownloadsList"></div>
            </div>
            <h3>Download Queue</h3>
            <div id="downloadsList" class="queue-list"></div>
        </section>

        <!-- Settings Section -->
        <section id="tab-settings" class="tab-content">
            <div class="settings-card">
                <h2>Server Settings</h2>
                <div class="form-grid">
                    <div class="form-group full">
                        <label for="set_navidrome_url">Navidrome URL</label>
                        <input type="url" id="set_navidrome_url" placeholder="https://music.example.com">
                    </div>
                </div>
                <div class="settings-actions">
                    <button id="saveSettingsBtn" class="save-btn" type="button">Save Settings</button>
                    <span id="settingsMsg" class="status-msg"></span>
                </div>
            </div>
        </section>
    </main>
</div>

<!-- Global Audio Player & Visualizer Bar -->
<audio id="global-audio-element"></audio>
<div id="global-player-bar" class="global-player-bar" style="display:none;">
    <div class="player-info">
        <div class="player-art-wrapper">
            <img id="gp-art" src="" alt="Album Art" />
        </div>
        <div class="player-text">
            <div id="gp-title" class="player-title">Track</div>
            <div id="gp-artist" class="player-artist">Artist</div>
        </div>
    </div>
    <div class="player-main">
        <div class="player-controls">
            <button id="gp-play-btn" class="btn-play-gp" type="button">▶</button>
        </div>
        <div class="player-progress">
            <span id="gp-cur-time">0:00</span>
            <input id="gp-seek" type="range" min="0" max="100" value="0" />
            <span id="gp-dur-time">0:00</span>
        </div>
    </div>
    <div class="player-extra">
        <div class="visualizer-wrapper">
            <canvas id="visualizer-canvas"></canvas>
        </div>
        <div class="volume-wrapper">
            <span class="volume-icon">🔊</span>
            <input id="gp-volume" type="range" min="0" max="1" step="0.01" value="1" />
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
