<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Downloader & Library</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <button id="btn-search" class="active" onclick="navigate('search')">Search</button>
        <button id="btn-downloads" onclick="navigate('downloads')">Downloads</button>
        <button id="btn-library" onclick="navigate('library')">Library</button>
        <button id="btn-settings" onclick="navigate('settings')">Settings</button>
    </nav>

    <!-- Main View Containers -->
    <main class="container">
        <!-- Search Tab -->
        <section id="tab-search" class="tab-content active">
            <div class="search-bar">
                <input type="text" id="searchQuery" placeholder="Search tracks or paste URL..." />
                <button onclick="performSearch()">Search</button>
            </div>
            <div id="searchResults"></div>
        </section>

        <!-- Downloads Tab -->
        <section id="tab-downloads" class="tab-content">
            <div class="tab-header">
                <h2>Download Queue</h2>
                <button class="btn-secondary" onclick="clearCompletedDownloads()">Clear Completed</button>
            </div>
            <div id="downloadList"></div>
        </section>

        <!-- Library Tab -->
        <section id="tab-library" class="tab-content">
            <div class="library-stats">
                <div>Tracks: <strong id="statTracks">0</strong></div>
                <div>Artists: <strong id="statArtists">0</strong></div>
                <div>Albums: <strong id="statAlbums">0</strong></div>
                <div>Total Files: <strong id="libCountDetail">0</strong></div>
                <div>Storage: <strong id="libFolderSize">0 B</strong></div>
            </div>
            <div class="search-bar" style="margin-top: 15px;">
                <input type="text" id="libSearchQuery" placeholder="Filter local library..." />
            </div>
            <div id="libraryList"></div>
        </section>

        <!-- Settings Tab -->
        <section id="tab-settings" class="tab-content">
            <div class="settings-form">
                <div class="form-group">
                    <label for="set_format">Audio Format</label>
                    <select id="set_format">
                        <option value="mp3">MP3</option>
                        <option value="flac">FLAC</option>
                        <option value="m4a">M4A</option>
                        <option value="opus">OPUS</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="set_quality">Audio Quality</label>
                    <select id="set_quality">
                        <option value="320K">320 kbps</option>
                        <option value="256K">256 kbps</option>
                        <option value="128K">128 kbps</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="set_max_results">Max Search Results</label>
                    <input type="number" id="set_max_results" value="20" min="1" max="50" />
                </div>

                <div class="form-group checkbox-group">
                    <label><input type="checkbox" id="set_thumb" /> Embed Covers & Artwork</label>
                    <label><input type="checkbox" id="set_meta" /> Embed Audio Metadata</label>
                    <label><input type="checkbox" id="set_organize" /> Subfolder by Artist</label>
                </div>

                <hr />

                <h3>Navidrome Server Settings</h3>
                <div class="form-group">
                    <label for="set_navidrome_url">Navidrome URL</label>
                    <input type="text" id="set_navidrome_url" placeholder="https://navidrome.example.com" />
                </div>
                <div class="form-group">
                    <label for="set_navidrome_user">Username</label>
                    <input type="text" id="set_navidrome_user" />
                </div>
                <div class="form-group">
                    <label for="set_navidrome_token">Token / Password</label>
                    <input type="password" id="set_navidrome_token" />
                </div>

                <button id="saveSettingsBtn" class="btn-primary">Save Settings</button>
                <div id="settingsMsg" class="status-msg"></div>
            </div>
        </section>
    </main>

    <!-- Global Floating Audio Player Bar -->
    <div id="global-player-bar" class="player-bar" style="display: none;">
        <img id="gp-art" src="" alt="Art" />
        <div class="player-info">
            <div id="gp-title" class="track-title"></div>
            <div id="gp-artist" class="track-artist"></div>
        </div>
        <div class="player-controls">
            <button id="gp-play-btn">▶</button>
            <span id="gp-cur-time">0:00</span>
            <input type="range" id="gp-seek" min="0" max="100" value="0" />
            <span id="gp-dur-time">0:00</span>
            <input type="range" id="gp-volume" min="0" max="1" step="0.05" value="1" />
        </div>
    </div>

    <!-- Optional Mobile Bottom Bar -->
    <div class="mobile-nav" style="display:none;">
        <button id="mob-btn-search" onclick="navigate('search')">Search</button>
        <button id="mob-btn-downloads" onclick="navigate('downloads')">Downloads</button>
        <button id="mob-btn-library" onclick="navigate('library')">Library (<span id="mobLibCount">0</span>)</button>
        <button id="mob-btn-settings" onclick="navigate('settings')">Settings</button>
    </div>

    <div id="toast-container"></div>

    <!-- Hidden HTML5 Audio Element -->
    <audio id="global-audio-element" style="display:none;"></audio>
    <script src="/static/app.js"></script>
</body>
</html>
