<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Downloader & Library</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar / Top Nav Header -->
        <header class="app-header">
            <div class="brand">
                <h1>🎵 Music Hub</h1>
            </div>
            <nav class="desktop-nav" aria-label="Desktop Navigation">
                <button class="nav-link active" id="btn-search" onclick="navigate('search')">Search</button>
                <button class="nav-link" id="btn-downloads" onclick="navigate('downloads')">Queue</button>
                <button class="nav-link" id="btn-library" onclick="navigate('library')">Library</button>
                <button class="nav-link" id="btn-settings" onclick="navigate('settings')">Settings</button>
            </nav>
        </header>

        <main class="main-content">
            <!-- TAB 1: SEARCH -->
            <section id="tab-search" class="tab-content active" role="tabpanel" aria-labelledby="btn-search">
                <div class="search-card">
                    <input id="searchQuery" type="text" placeholder="Search tracks, artists, albums..." autocomplete="off" />
                    <button id="searchBtn" type="button" onclick="performSearch()">Search</button>
                </div>
                <div id="searchResults" class="results-grid"></div>
            </section>

            <!-- TAB 2: DOWNLOADS / QUEUE -->
            <section id="tab-downloads" class="tab-content" role="tabpanel" aria-labelledby="btn-downloads">
                <div class="queue-header">
                    <h2>Download Queue</h2>
                    <button class="btn-clear" onclick="clearCompletedDownloads()">Clear Completed</button>
                </div>
                <div id="downloadList" class="queue-list"></div>
            </section>

            <!-- TAB 3: LIBRARY -->
            <section id="tab-library" class="tab-content" role="tabpanel" aria-labelledby="btn-library">
                <div class="library-header-bar">
                    <div class="library-stats-overview">
                        <div class="stats-grid">
                            <div class="stat-card">
                                <span class="stat-value" id="statTracks">0</span>
                                <span class="stat-label">Tracks</span>
                            </div>
                            <div class="stat-card">
                                <span class="stat-value" id="statArtists">0</span>
                                <span class="stat-label">Artists</span>
                            </div>
                            <div class="stat-card">
                                <span class="stat-value" id="statAlbums">0</span>
                                <span class="stat-label">Albums</span>
                            </div>
                        </div>
                    </div>
                    <div class="library-meta">
                        <span>Tracks: <strong id="libCountDetail">0</strong></span>
                        <span>Size: <strong id="libFolderSize">0 B</strong></span>
                        <button class="btn-refresh" onclick="loadLibrary()">🔄 Refresh</button>
                    </div>
                </div>

                <div class="search-card">
                    <label for="libSearchQuery" class="sr-only">Search local library</label>
                    <input id="libSearchQuery" placeholder="Filter local library..." autocomplete="off" />
                </div>

                <div id="libraryList" class="results-grid"></div>
            </section>

            <!-- TAB 4: SETTINGS -->
            <section id="tab-settings" class="tab-content" role="tabpanel" aria-labelledby="btn-settings">
                <div class="settings-card">
                    <div class="form-group">
                        <label for="set_format">Audio Format</label>
                        <select id="set_format">
                            <option value="mp3">MP3</option>
                            <option value="m4a">M4A</option>
                            <option value="flac">FLAC</option>
                            <option value="ogg">OGG</option>
                            <option value="opus">OPUS</option>
                            <option value="wav">WAV</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="set_quality">Audio Quality</label>
                        <select id="set_quality">
                            <option value="320K">320 kbps</option>
                            <option value="256K">256 kbps</option>
                            <option value="192K">192 kbps</option>
                            <option value="128K">128 kbps</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="set_max_results">Max Search Results</label>
                        <input type="number" id="set_max_results" min="1" max="100" value="20" />
                    </div>

                    <div class="form-group">
                        <label for="set_theme">Theme</label>
                        <select id="set_theme">
                            <option value="dark">Dark</option>
                            <option value="light">Light</option>
                        </select>
                    </div>

                    <div class="form-checkbox">
                        <input type="checkbox" id="set_thumb" />
                        <label for="set_thumb">Embed Thumbnail in Audio</label>
                    </div>

                    <div class="form-checkbox">
                        <input type="checkbox" id="set_meta">
                        <label for="set_meta">Embed Metadata ID3 Tags</label>
                    </div>

                    <div class="form-checkbox">
                        <input type="checkbox" id="set_organize">
                        <label for="set_organize">Organize Library by Artist Folder</label>
                    </div>

                    <hr />

                    <div class="form-group">
                        <label for="set_navidrome_url">Navidrome URL</label>
                        <input type="url" id="set_navidrome_url" placeholder="http://localhost:4533" />
                    </div>

                    <div class="form-group">
                        <label for="set_navidrome_user">Navidrome Username</label>
                        <input type="text" id="set_navidrome_user" placeholder="Admin" />
                    </div>

                    <div class="form-group">
                        <label for="set_navidrome_token">Navidrome Token</label>
                        <input type="password" id="set_navidrome_token" placeholder="Token" />
                    </div>

                    <div class="settings-actions">
                        <button id="saveSettingsBtn" type="button">Save Settings</button>
                        <span id="settingsMsg" class="status-msg"></span>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Mobile Navigation -->
    <nav class="mobile-nav" aria-label="Mobile Navigation">
        <button class="nav-link active" id="mob-btn-search" onclick="navigate('search')"><span>🔍</span>Search</button>
        <button class="nav-link" id="mob-btn-downloads" onclick="navigate('downloads')"><span>⬇️</span>Queue</button>
        <button class="nav-link" id="mob-btn-library" onclick="navigate('library')"><span>📂</span>Library (<span id="mobLibCount">0</span>)</button>
        <button class="nav-link" id="mob-btn-settings" onclick="navigate('settings')"><span>⚙️</span>Settings</button>
    </nav>

    <!-- Global Player Bar -->
    <div class="global-player-bar" id="global-player-bar" style="display: none;">
        <div class="player-info">
            <img id="gp-art" src="" alt="Album Cover" />
            <div class="player-text">
                <div id="gp-title" class="player-title">Track Title</div>
                <div id="gp-artist" class="player-artist">Artist</div>
            </div>
        </div>
        <div class="player-controls">
            <button id="gp-play-btn" type="button" class="btn-play-gp">▶</button>
            <span id="gp-cur-time">0:00</span>
            <input type="range" id="gp-seek" value="0" min="0" max="100" />
            <span id="gp-dur-time">0:00</span>
        </div>
        <div class="player-extra">
            <canvas id="visualizer-canvas" width="120" height="32"></canvas>
            <input type="range" id="gp-volume" value="1" min="0" max="1" step="0.05" aria-label="Volume" />
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
