name: Xrob Music
version: "3.5.16"
slug: music_downloader
description: Search, download, manage and stream your music library
url: "https://github.com/ahmedxrob/ai-project"

arch:
  - amd64
  - aarch64

startup: services
boot: auto

ingress: false

panel_icon: mdi:music
panel_title: Xrob Music
panel_url: "http://192.168.1.73:8100"

ports:
  8099/tcp: 8100

map:
  - share:rw
  - media:rw

options:
  music_path: "/media/xrob-music"
  subsonic_user: "admin"
  subsonic_password: ""

schema:
  music_path: str
  subsonic_user: str
  subsonic_password: password
