name: Xrob Music
version: "2.0.7"
slug: music_downloader
description: Search, download, manage and stream your music library
url: "https://github.com/ahmedxrob/ai-project"

arch:
  - amd64
  - aarch64

startup: services
boot: auto

ingress: true
ingress_port: 8099

panel_icon: mdi:music
panel_title: Xrob Music

ports:
  8099/tcp: 8099

map:
  - share:rw

options:
  subsonic_user: "admin"
  subsonic_password: ""

schema:
  subsonic_user: str
  subsonic_password: password
