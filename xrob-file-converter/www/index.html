<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Xrob File Converter</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #101010;
    color: #fff;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 24px;
}

.container {
    width: min(720px, 100%);
}

.header {
    text-align: center;
    margin-bottom: 28px;
}

.logo {
    width: 58px;
    height: 58px;

    margin: 0 auto 14px;

    border-radius: 16px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #1ed760;
    color: #000;

    font-size: 28px;
    font-weight: 800;
}

h1 {
    margin: 0;
    font-size: 30px;
}

.subtitle {
    margin-top: 8px;
    color: #999;
}

.card {
    background: #181818;

    border: 1px solid #292929;

    border-radius: 18px;

    padding: 28px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.35);
}

.drop {
    border: 2px dashed #3a3a3a;

    border-radius: 14px;

    padding: 42px 20px;

    text-align: center;

    cursor: pointer;

    transition: .2s;
}

.drop:hover {
    border-color: #1ed760;
    background: #1b1b1b;
}

.drop.dragging {
    border-color: #1ed760;
    background: #202020;
}

.drop-icon {
    font-size: 42px;
    margin-bottom: 12px;
}

.drop-title {
    font-size: 18px;
    font-weight: 700;
}

.drop-subtitle {
    color: #888;
    margin-top: 7px;
}

#fileInput {
    display: none;
}

.filename {
    margin-top: 16px;

    padding: 12px;

    border-radius: 10px;

    background: #222;

    color: #bbb;

    display: none;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.controls {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 14px;

    margin-top: 20px;
}

label {
    display: block;

    margin-bottom: 7px;

    color: #aaa;

    font-size: 13px;
}

select,
button {
    width: 100%;

    border: 0;

    border-radius: 10px;

    padding: 13px;

    font-size: 15px;
}

select {
    background: #252525;
    color: white;
}

button {
    background: #1ed760;
    color: #000;

    font-weight: 800;

    cursor: pointer;

    transition: .2s;
}

button:hover {
    filter: brightness(1.08);
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.status {
    display: none;

    margin-top: 20px;

    padding: 14px;

    border-radius: 10px;

    background: #222;

    color: #ddd;

    text-align: center;
}

.download {
    display: none;

    margin-top: 14px;

    padding: 14px;

    border-radius: 10px;

    background: #303030;

    color: #1ed760;

    text-align: center;

    font-weight: 700;

    text-decoration: none;
}

.footer {
    text-align: center;

    margin-top: 18px;

    color: #666;

    font-size: 12px;
}

@media (max-width: 600px) {

    .controls {
        grid-template-columns: 1fr;
    }

    .card {
        padding: 18px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            X
        </div>

        <h1>Xrob File Converter</h1>

        <div class="subtitle">
            Fast, lightweight local file conversion
        </div>

    </div>

    <div class="card">

        <div
            class="drop"
            id="drop"
        >

            <div class="drop-icon">
                📁
            </div>

            <div class="drop-title">
                Drop a file here
            </div>

            <div class="drop-subtitle">
                or click to browse
            </div>

        </div>

        <input
            id="fileInput"
            type="file"
        >

        <div
            id="filename"
            class="filename"
        ></div>

        <div class="controls">

            <div>

                <label for="target">
                    Convert to
                </label>

                <select id="target">

                    <option value="pdf">
                        PDF
                    </option>

                    <option value="png">
                        PNG
                    </option>

                    <option value="jpg">
                        JPG
                    </option>

                    <option value="webp">
                        WebP
                    </option>

                    <option value="mp3">
                        MP3
                    </option>

                    <option value="wav">
                        WAV
                    </option>

                    <option value="flac">
                        FLAC
                    </option>

                    <option value="mp4">
                        MP4
                    </option>

                    <option value="mkv">
                        MKV
                    </option>

                    <option value="webm">
                        WebM
                    </option>

                    <option value="docx">
                        DOCX
                    </option>

                    <option value="xlsx">
                        XLSX
                    </option>

                    <option value="pptx">
                        PPTX
                    </option>

                </select>

            </div>

            <div>

                <label>
                    Action
                </label>

                <button
                    id="convert"
                    disabled
                >
                    Convert
                </button>

            </div>

        </div>

        <div
            id="status"
            class="status"
        ></div>

        <a
            id="download"
            class="download"
        ></a>

    </div>

    <div class="footer">
        Xrob • Runs locally on your Home Assistant
    </div>

</div>

<script>

const fileInput =
    document.getElementById("fileInput");

const drop =
    document.getElementById("drop");

const filename =
    document.getElementById("filename");

const target =
    document.getElementById("target");

const convert =
    document.getElementById("convert");

const status =
    document.getElementById("status");

const download =
    document.getElementById("download");


drop.addEventListener(
    "click",
    () => fileInput.click()
);


fileInput.addEventListener(
    "change",
    updateFile
);


function updateFile() {

    if (!fileInput.files.length) {

        filename.style.display = "none";

        convert.disabled = true;

        return;
    }

    filename.textContent =
        fileInput.files[0].name;

    filename.style.display =
        "block";

    convert.disabled = false;
}


drop.addEventListener(
    "dragover",
    event => {

        event.preventDefault();

        drop.classList.add("dragging");
    }
);


drop.addEventListener(
    "dragleave",
    () => {

        drop.classList.remove("dragging");
    }
);


drop.addEventListener(
    "drop",
    event => {

        event.preventDefault();

        drop.classList.remove("dragging");

        if (!event.dataTransfer.files.length) {
            return;
        }

        fileInput.files =
            event.dataTransfer.files;

        updateFile();
    }
);


convert.addEventListener(
    "click",
    async () => {

        if (!fileInput.files.length) {
            return;
        }

        const form =
            new FormData();

        form.append(
            "file",
            fileInput.files[0]
        );

        status.style.display =
            "block";

        status.textContent =
            "Converting...";

        download.style.display =
            "none";

        convert.disabled =
            true;

        try {

            const response =
                await fetch(
                    `convert?target=${
                        encodeURIComponent(
                            target.value
                        )
                    }`,
                    {
                        method: "POST",
                        body: form
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    "Conversion failed."
                );
            }

            status.textContent =
                "✅ Conversion completed!";

            download.href =
                data.download;

            download.textContent =
                "⬇️ Download " +
                data.filename;

            download.style.display =
                "block";

        } catch (error) {

            status.textContent =
                "❌ " +
                error.message;

        } finally {

            convert.disabled =
                false;
        }
    }
);

</script>

</body>
</html>
