<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Xrob File Converter</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #121212;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: min(700px, 94%);
}

.card {
    background: #1e1e1e;
    border-radius: 18px;
    padding: 35px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
}

h1 {
    margin-top: 0;
    font-size: 30px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 30px;
}

.drop {
    border: 2px dashed #555;
    border-radius: 14px;
    padding: 45px 20px;
    text-align: center;
    cursor: pointer;
    transition: .2s;
}

.drop:hover {
    border-color: #1ed760;
    background: #191919;
}

.drop input {
    display: none;
}

.filename {
    margin-top: 15px;
    color: #1ed760;
    word-break: break-all;
}

label {
    display: block;
    margin-top: 25px;
    margin-bottom: 8px;
    color: #bbb;
}

select,
button {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 0;
    font-size: 16px;
}

select {
    background: #292929;
    color: white;
}

button {
    margin-top: 25px;
    background: #1ed760;
    color: #000;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.status {
    margin-top: 20px;
    padding: 15px;
    border-radius: 10px;
    background: #292929;
    display: none;
}

.download {
    display: block;
    margin-top: 20px;
    padding: 14px;
    text-align: center;
    border-radius: 10px;
    background: #333;
    color: white;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>⚡ Xrob File Converter</h1>

<div class="subtitle">
Convert documents, images, audio and video locally.
</div>

<label class="drop">

<input type="file" id="file">

<div>
📁 Click to select a file
</div>

<div class="filename" id="filename"></div>

</label>

<label for="target">
Convert to
</label>

<select id="target">

<option value="pdf">PDF</option>

<option value="png">PNG</option>
<option value="jpg">JPG</option>
<option value="webp">WebP</option>

<option value="mp3">MP3</option>
<option value="wav">WAV</option>
<option value="flac">FLAC</option>

<option value="mp4">MP4</option>
<option value="mkv">MKV</option>
<option value="webm">WebM</option>

</select>

<button id="convert">
Convert File
</button>

<div class="status" id="status"></div>

<a
    class="download"
    id="download"
    style="display:none"
>
Download Converted File
</a>

</div>

</div>

<script>

const fileInput = document.getElementById("file");
const filename = document.getElementById("filename");
const target = document.getElementById("target");
const convert = document.getElementById("convert");
const status = document.getElementById("status");
const download = document.getElementById("download");

fileInput.addEventListener("change", () => {

    if (!fileInput.files.length) {
        filename.textContent = "";
        return;
    }

    filename.textContent =
        fileInput.files[0].name;

});

convert.addEventListener("click", async () => {

    if (!fileInput.files.length) {

        alert("Please select a file.");

        return;
    }

    const form = new FormData();

    form.append(
        "file",
        fileInput.files[0]
    );

    status.style.display = "block";
    status.textContent = "Converting...";
    download.style.display = "none";
    convert.disabled = true;

    try {

        const response = await fetch(
            `/convert?target=${encodeURIComponent(target.value)}`,
            {
                method: "POST",
                body: form
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.detail || "Conversion failed."
            );
        }

        status.textContent =
            "✅ Conversion completed!";

        download.href = data.download;
        download.textContent =
            "⬇️ Download " + data.filename;

        download.style.display = "block";

    } catch (error) {

        status.textContent =
            "❌ " + error.message;

    } finally {

        convert.disabled = false;

    }

});

</script>

</body>
</html>
