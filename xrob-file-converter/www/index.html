<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Xrob File Converter</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(
            circle at top,
            #242424 0,
            #121212 45%,
            #0b0b0b 100%
        );

    color: #ffffff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

.container {
    width: min(900px, 94%);
    margin: auto;
    padding: 50px 0;
}

.header {
    text-align: center;
    margin-bottom: 35px;
}

.logo {
    width: 70px;
    height: 70px;

    margin: auto;

    border-radius: 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 34px;

    background: #1ed760;

    color: #000;

    box-shadow:
        0 10px 35px rgba(0,0,0,.4);
}

h1 {
    margin: 20px 0 8px;
    font-size: 32px;
}

.subtitle {
    color: #aaa;
}

.card {
    background: rgba(30,30,30,.95);

    border: 1px solid rgba(255,255,255,.08);

    border-radius: 20px;

    padding: 30px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.35);
}

.drop {
    border: 2px dashed #555;

    border-radius: 16px;

    padding: 45px 20px;

    text-align: center;

    cursor: pointer;

    transition: .2s;
}

.drop:hover,
.drop.drag {
    border-color: #1ed760;

    background: rgba(30,215,96,.06);
}

.drop-icon {
    font-size: 45px;
    margin-bottom: 10px;
}

.drop strong {
    display: block;

    font-size: 18px;

    margin-bottom: 8px;
}

.drop span {
    color: #999;
}

input[type=file] {
    display: none;
}

.file {
    display: none;

    margin-top: 20px;

    padding: 15px;

    background: #252525;

    border-radius: 12px;
}

.file.show {
    display: flex;

    justify-content: space-between;
    align-items: center;
}

.file-name {
    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}

select {
    width: 100%;

    margin-top: 25px;

    padding: 15px;

    border: 1px solid #444;

    border-radius: 10px;

    background: #181818;

    color: white;

    font-size: 16px;
}

button {
    width: 100%;

    margin-top: 20px;

    padding: 15px;

    border: none;

    border-radius: 10px;

    background: #1ed760;

    color: #000;

    font-weight: 700;

    font-size: 16px;

    cursor: pointer;
}

button:hover {
    filter: brightness(1.08);
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.status {
    margin-top: 20px;

    padding: 15px;

    border-radius: 10px;

    display: none;

    background: #252525;
}

.status.show {
    display: block;
}

.success {
    color: #1ed760;
}

.error {
    color: #ff6b6b;
}

.download {
    display: inline-block;

    margin-top: 12px;

    color: #1ed760;

    font-weight: 700;

    text-decoration: none;
}

.footer {
    text-align: center;

    margin-top: 25px;

    color: #666;

    font-size: 13px;
}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            ⇄
        </div>

        <h1>
            Xrob File Converter
        </h1>

        <div class="subtitle">
            Private conversion directly on your server
        </div>

    </div>


    <div class="card">

        <div
            class="drop"
            id="drop"
        >

            <div class="drop-icon">
                📄
            </div>

            <strong>
                Drop your file here
            </strong>

            <span>
                or click to browse
            </span>

            <input
                type="file"
                id="file"
            >

        </div>


        <div
            class="file"
            id="fileBox"
        >

            <span
                class="file-name"
                id="fileName"
            ></span>

            <span>
                ✓
            </span>

        </div>


        <select id="format">

            <option value="">
                Select output format
            </option>

            <option value="pdf">
                PDF
            </option>

            <option value="png">
                PNG
            </option>

            <option value="jpg">
                JPG
            </option>

            <option value="mp3">
                MP3
            </option>

            <option value="mp4">
                MP4
            </option>

        </select>


        <button
            id="convert"
            disabled
        >
            Convert
        </button>


        <div
            class="status"
            id="status"
        ></div>

    </div>


    <div class="footer">
        Xrob File Converter · Files stay on your server
    </div>

</div>


<script>

const drop = document.getElementById("drop");
const fileInput = document.getElementById("file");

const fileBox = document.getElementById("fileBox");
const fileName = document.getElementById("fileName");

const format = document.getElementById("format");

const convert = document.getElementById("convert");

const status = document.getElementById("status");

let selectedFile = null;


drop.addEventListener(
    "click",
    () => fileInput.click()
);


fileInput.addEventListener(
    "change",
    () => {

        if (fileInput.files.length) {

            selectFile(
                fileInput.files[0]
            );

        }

    }
);


drop.addEventListener(
    "dragover",
    event => {

        event.preventDefault();

        drop.classList.add("drag");

    }
);


drop.addEventListener(
    "dragleave",
    () => {

        drop.classList.remove("drag");

    }
);


drop.addEventListener(
    "drop",
    event => {

        event.preventDefault();

        drop.classList.remove("drag");

        if (
            event.dataTransfer.files.length
        ) {

            selectFile(
                event.dataTransfer.files[0]
            );

        }

    }
);


function selectFile(file) {

    selectedFile = file;

    fileName.textContent =
        file.name;

    fileBox.classList.add("show");

    updateButton();

}


format.addEventListener(
    "change",
    updateButton
);


function updateButton() {

    convert.disabled =
        !selectedFile ||
        !format.value;

}


convert.addEventListener(
    "click",
    async () => {

        if (!selectedFile) {
            return;
        }

        convert.disabled = true;

        status.className =
            "status show";

        status.innerHTML =
            "⏳ Converting...";

        const data =
            new FormData();

        data.append(
            "file",
            selectedFile
        );

        data.append(
            "output_format",
            format.value
        );

        try {

            const response =
                await fetch(
                    "/api/convert",
                    {
                        method: "POST",
                        body: data
                    }
                );

            const result =
                await response.json();

            if (!response.ok ||
                !result.success) {

                throw new Error(
                    result.error ||
                    "Conversion failed."
                );

            }

            status.innerHTML =
                `
                <div class="success">
                    ✓ Conversion complete
                </div>

                <a
                    class="download"
                    href="${result.download}"
                    download
                >
                    Download ${result.filename}
                </a>
                `;

        } catch (error) {

            status.innerHTML =
                `
                <div class="error">
                    ✕ ${error.message}
                </div>
                `;

        } finally {

            convert.disabled = false;

        }

    }
);

</script>

</body>

</html>
