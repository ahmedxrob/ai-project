name: "Xrob File Converter"
version: "1.1.0"
slug: "xrob_file_converter"
description: "Lightweight self-hosted file converter for Home Assistant"
url: "https://github.com/ahmedxrob/ai-project"

arch:
  - amd64

startup: application
boot: auto
init: false

ports:
  8000/tcp: 8000

ports_description:
  8000/tcp: "Web interface"

webui: "http://[HOST]:[PORT:8000]"

panel_icon: mdi:file-swap-horizontal
panel_title: "Xrob File Converter"

map:
  - type: data
    read_only: false
