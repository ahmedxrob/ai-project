name: My Movie AI
version: "1.6.3"
slug: movie_ai
description: Personal movie and series database with Gemini and TMDB recommendations
url: https://github.com/ahmedxrob/ai-project

arch:
  - amd64

startup: application
boot: auto
init: false

# ============================================================
# HOME ASSISTANT SIDEBAR / INGRESS
# ============================================================

ingress: true
ingress_port: 8099
ingress_entry: /

panel_icon: mdi:movie-open
panel_title: My Movie AI
panel_admin: false

# ============================================================
# DIRECT PORT
# ============================================================

ports:
  8099/tcp: 8099

ports_description:
  8099/tcp: Movie AI web interface

# Open Web UI should go directly to recommendations.
webui: "http://[HOST]:[PORT:8099]/recommendations"

# ============================================================
# OPTIONS
# ============================================================

options:
  tmdb_token: ""
  gemini_api_key: ""

schema:
  tmdb_token: password
  gemini_api_key: password

