name: My Movie AI
version: "1.2.7"
slug: movie_ai
description: Personal movie and series database with Gemini and TMDB recommendations
url: https://github.com/ahmedxrob/ai-project

arch:
  - amd64

startup: application
boot: auto
init: false

# ============================================================
# HOME ASSISTANT INGRESS
# ============================================================

ingress: true
ingress_port: 8099
ingress_entry: /
ingress_stream: true

panel_icon: mdi:movie-open
panel_title: My Movie AI
panel_admin: false

# ============================================================
# DIRECT WEB ACCESS
# ============================================================

ports:
  8099/tcp: 8099

ports_description:
  8099/tcp: Movie AI web interface

webui: "http://[HOST]:[PORT:8099]"

# ============================================================
# OPTIONS
# ============================================================

options:
  tmdb_token: ""
  gemini_api_key: ""

schema:
  tmdb_token: password
  gemini_api_key: password

