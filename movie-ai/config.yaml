name: My Movie AI
version: "1.9.5"
slug: movie_ai
description: Personal movie and series database with AI recommendations, taste profiling, watchlist, analytics and discovery
url: https://github.com/ahmedxrob/ai-project

arch:
  - amd64

startup: application
boot: auto
init: false

webui: "http://[HOST]:[PORT:8099]/recommendations"

panel_icon: mdi:movie-open
panel_title: My Movie AI
panel_admin: false

ports:
  8099/tcp: 8099

ports_description:
  8099/tcp: Movie AI web interface

options:
  tmdb_token: ""
  gemini_api_key: ""

schema:
  tmdb_token: password
  gemini_api_key: password

