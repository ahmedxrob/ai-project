<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#060608">
<title>{% block title %}My Movie AI{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="{{ ingress_path|default('') }}/static/favicon.svg">
<link rel="stylesheet" href="{{ ingress_path|default('') }}/static/style.css">
</head>
<body data-ingress-path="{{ ingress_path|default('') }}" data-page="{{ page|default('') }}">
<div class="site-background"></div>
<nav class="topbar app-topbar">
  <a class="brand" href="{{ ingress_path|default('') }}/recommendations" aria-label="My Movie AI home">
    <div class="brand-icon">🎬</div><div class="brand-text"><strong>My Movie AI</strong><span>your personal cinema</span></div>
  </a>
  <div class="app-nav" aria-label="Primary navigation">
    <a href="{{ ingress_path|default('') }}/recommendations" data-nav="recommendations">Home</a>
    <a href="{{ ingress_path|default('') }}/search" data-nav="search">Search</a>
    <a href="{{ ingress_path|default('') }}/watched" data-nav="watched">Watched</a>
    <a href="{{ ingress_path|default('') }}/watchlist" data-nav="watchlist">Watchlist</a>
    <a href="{{ ingress_path|default('') }}/stats" data-nav="stats">Stats</a>
    <a href="{{ ingress_path|default('') }}/taste" data-nav="taste">Taste</a>
    <a href="{{ ingress_path|default('') }}/settings" data-nav="settings">Settings</a>
  </div>
  <div class="topbar-status"><span class="status-dot"></span> Local library</div>
</nav>
<main class="page app-page">
{% block content %}{% endblock %}
</main>
<footer class="app-footer"><span>My Movie AI</span><span>Private cinema · local-first</span></footer>
<script>
(function(){ const p=document.body.dataset.page; document.querySelectorAll('[data-nav]').forEach(a=>{if(a.dataset.nav===p)a.classList.add('active')}); })();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
