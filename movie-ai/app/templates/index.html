<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#060608">
    <title>{% if page == 'detail' %}{{ detail.title }} — My Movie AI{% elif page == 'library' %}

<div class="site-background library-background"></div>

<nav class="topbar">
    <div class="brand">
        <div class="brand-icon">🎬</div>
        <div class="brand-text"><strong>My Movie AI</strong><span>your personal cinema</span></div>
    </div>
    <div class="topbar-actions">
        <a class="topbar-search-button" href="{{ ingress_path|default('') }}/recommendations"><span>✦</span><strong>Discover</strong></a>
        <a class="topbar-search-button active" href="{{ ingress_path|default('') }}/library"><span>▣</span><strong>Library</strong></a>
    </div>
</nav>

<main class="media-library-page">
    <section class="library-hero">
        <div class="library-hero-glow"></div>
        <div class="library-hero-content">
            <div class="local-kicker">YOUR LOCAL CINEMA</div>
            <h1>Your Library</h1>
            <p>Every movie and episode on your Debian mini PC, streamed directly from your HDD across your local network.</p>
            <div class="library-hero-actions">
                <button id="scanButton" class="library-action primary">↻ Scan library</button>
                <button id="refreshButton" class="library-action">Refresh</button>
            </div>
        </div>
        <div class="library-hero-stats">
            <div><strong id="countTotal">{{ counts.total }}</strong><span>Titles & episodes</span></div>
            <div><strong id="countMovies">{{ counts.Movie }}</strong><span>Movies</span></div>
            <div><strong id="countSeries">{{ counts.Series }}</strong><span>Episodes</span></div>
        </div>
    </section>

    <section class="library-toolbar">
        <div class="library-tabs" role="tablist" aria-label="Library filter">
            <button class="library-tab active" data-filter="all">All</button>
            <button class="library-tab" data-filter="Movie">Movies</button>
            <button class="library-tab" data-filter="Series">TV Shows</button>
        </div>
        <label class="library-search"><span>⌕</span><input id="librarySearch" type="search" placeholder="Search your library…" autocomplete="off"></label>
        <div class="local-notice compact">Storage: <strong>{{ media_root }}</strong></div>
    </section>

    <section class="library-rail" id="continueSection" hidden>
        <div class="rail-heading"><div><span class="rail-kicker">PICK UP WHERE YOU LEFT OFF</span><h2>Continue Watching</h2></div></div>
        <div id="continueGrid" class="media-card-grid continue-grid"></div>
    </section>

    <section class="library-rail" id="moviesSection">
        <div class="rail-heading"><div><span class="rail-kicker">LOCAL MOVIES</span><h2>Movies</h2></div><span id="movieRailCount" class="rail-count"></span></div>
        <div id="moviesGrid" class="media-card-grid"></div>
    </section>

    <section class="library-rail" id="seriesSection">
        <div class="rail-heading"><div><span class="rail-kicker">LOCAL SERIES</span><h2>TV Shows</h2></div><span id="seriesRailCount" class="rail-count"></span></div>
        <div id="seriesGrid" class="media-card-grid"></div>
    </section>

    <div id="libraryEmpty" class="library-empty-state" hidden>
        <div class="empty-art">🎬</div>
        <h2>Your local library is empty</h2>
        <p>Put video files in <strong>/mnt/storage/media/movies</strong> or <strong>/mnt/storage/media/tv</strong>, then scan again.</p>
        <button class="library-action primary" onclick="document.getElementById('scanButton').click()">Scan library</button>
    </div>
</main>

<div id="playerModal" class="player-modal" hidden>
    <div class="player-backdrop" data-close-player></div>
    <div class="player-dialog" role="dialog" aria-modal="true" aria-label="Local media player">
        <button class="player-close" type="button" data-close-player aria-label="Close player">×</button>
        <div class="player-video-wrap"><video id="playerVideo" controls playsinline preload="metadata"></video></div>
        <div class="player-info"><div><span id="playerKicker" class="rail-kicker"></span><h2 id="playerTitle"></h2><p id="playerMeta"></p></div></div>
    </div>
</div>

<script>
const base = document.body.dataset.ingressPath || '';
const streamUrl = id => `${base}/api/library/${id}/stream`;
const fmtSize = bytes => { if (!bytes) return ''; const u=['B','KB','MB','GB','TB']; const i=Math.min(Math.floor(Math.log(bytes)/Math.log(1024)),u.length-1); return `${(bytes/Math.pow(1024,i)).toFixed(i?1:0)} ${u[i]}`; };
const escapeHtml = v => String(v ?? '').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
let allMedia = [], currentFilter = 'all', currentSearch = '';

function episodeLabel(item){ return item.season ? `S${String(item.season).padStart(2,'0')}E${String(item.episode||0).padStart(2,'0')}` : 'Episode'; }
function posterMarkup(item, label, series=false){
    const seed = encodeURIComponent((item.title || 'Movie').slice(0,24));
    return `<div class="media-poster ${series?'series-poster':''}" style="--poster-seed:'${seed}'"><div class="poster-noise"></div><span class="poster-icon">${series?'▣':'▶'}</span><span class="poster-title">${escapeHtml(label)}</span></div>`;
}
function movieCard(item){
    const progress = Number(item.watched_position || 0);
    const pct = item.duration_seconds ? Math.min(100, Math.round(progress / item.duration_seconds * 100)) : 0;
    return `<article class="media-card" data-kind="Movie" data-title="${escapeHtml(item.title)}" data-id="${item.id}">
        <button class="media-card-open" data-play-id="${item.id}" aria-label="Play ${escapeHtml(item.title)}">
            ${posterMarkup(item,item.title)}
            <span class="play-badge">▶</span>
            ${pct>0?`<span class="progress-line"><i style="width:${pct}%"></i></span>`:''}
        </button>
        <div class="media-card-info"><h3>${escapeHtml(item.title)}</h3><p>${[item.year,fmtSize(item.size_bytes)].filter(Boolean).join(' · ') || 'Local movie'}</p></div>
    </article>`;
}
function seriesGroups(items){
    const map = new Map();
    items.forEach(item=>{ const key=item.title.toLowerCase(); if(!map.has(key)) map.set(key, {title:item.title, items:[]}); map.get(key).items.push(item); });
    return [...map.values()].sort((a,b)=>a.title.localeCompare(b.title));
}
function seriesCard(group){
    const first = [...group.items].sort((a,b)=>(a.season||0)-(b.season||0)||(a.episode||0)-(b.episode||0))[0];
    const watched = group.items.filter(x=>Number(x.watched_position||0)>0).length;
    return `<article class="media-card" data-kind="Series" data-title="${escapeHtml(group.title)}" data-id="${first.id}">
        <button class="media-card-open" data-play-id="${first.id}" aria-label="Play ${escapeHtml(group.title)}">
            ${posterMarkup(first,group.title,true)}<span class="play-badge">▶</span>
        </button>
        <div class="media-card-info"><h3>${escapeHtml(group.title)}</h3><p>${group.items.length} episode${group.items.length===1?'':'s'}${watched?' · '+watched+' in progress':''}</p></div>
    </article>`;
}
function matches(item){ return (currentFilter==='all'||item.media_type===currentFilter) && (!currentSearch || item.title.toLowerCase().includes(currentSearch)); }
function emptyCard(text){ return `<div class="library-inline-empty"><span>✦</span><strong>${escapeHtml(text)}</strong></div>`; }
function render(){
    const visible=allMedia.filter(matches), movies=visible.filter(x=>x.media_type==='Movie'), series=visible.filter(x=>x.media_type==='Series'), groups=seriesGroups(series);
    const continued=allMedia.filter(x=>Number(x.watched_position||0)>0).sort((a,b)=>(b.watched_at||'').localeCompare(a.watched_at||'')).slice(0,8);
    document.getElementById('moviesGrid').innerHTML=movies.length?movies.map(movieCard).join(''):emptyCard(currentSearch?'No matching movies.':'No movies yet.');
    document.getElementById('seriesGrid').innerHTML=groups.length?groups.map(seriesCard).join(''):emptyCard(currentSearch?'No matching TV shows.':'No TV shows yet.');
    document.getElementById('movieRailCount').textContent=movies.length?`${movies.length} title${movies.length===1?'':'s'}`:'';
    document.getElementById('seriesRailCount').textContent=groups.length?`${groups.length} show${groups.length===1?'':'s'}`:'';
    const cont=document.getElementById('continueSection'); cont.hidden=!continued.length; document.getElementById('continueGrid').innerHTML=continued.map(movieCard).join('');
    document.getElementById('moviesSection').hidden=currentFilter==='Series';
    document.getElementById('seriesSection').hidden=currentFilter==='Movie';
    document.getElementById('libraryEmpty').hidden=allMedia.length>0 || currentSearch.length>0;
    bindPlayButtons();
}
async function load(){
    try { const r=await fetch(`${base}/api/library`); const d=await r.json(); allMedia=d.results||[]; document.getElementById('countTotal').textContent=d.counts.total; document.getElementById('countMovies').textContent=d.counts.Movie; document.getElementById('countSeries').textContent=d.counts.Series; render(); }
    catch(e){ console.error(e); }
}
function openPlayer(id){
    const item=allMedia.find(x=>String(x.id)===String(id)); if(!item) return;
    const video=document.getElementById('playerVideo'); video.src=streamUrl(item.id); video.currentTime=Number(item.watched_position||0);
    document.getElementById('playerKicker').textContent=item.media_type==='Series'?`${episodeLabel(item)} · TV SHOW`:'LOCAL MOVIE';
    document.getElementById('playerTitle').textContent=item.title;
    document.getElementById('playerMeta').textContent=[item.year,item.file_name,fmtSize(item.size_bytes)].filter(Boolean).join(' · ');
    document.getElementById('playerModal').hidden=false; document.body.classList.add('modal-open'); video.play().catch(()=>{});
}
function closePlayer(){ const m=document.getElementById('playerModal'),v=document.getElementById('playerVideo'); if(m.hidden)return; if(v.dataset.mediaId) saveProgress(v.dataset.mediaId,v.currentTime); v.pause();v.removeAttribute('src');v.load();m.hidden=true;document.body.classList.remove('modal-open'); }
function bindPlayButtons(){ document.querySelectorAll('[data-play-id]').forEach(b=>b.onclick=()=>{document.getElementById('playerVideo').dataset.mediaId=b.dataset.playId;openPlayer(b.dataset.playId);}); }
async function saveProgress(id,pos){try{const body=new URLSearchParams({position:String(pos)});await fetch(`${base}/api/library/${id}/progress`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});}catch(e){}}
document.querySelectorAll('[data-close-player]').forEach(x=>x.addEventListener('click',closePlayer));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePlayer();});
document.getElementById('playerVideo').addEventListener('timeupdate',e=>{const v=e.currentTarget;if(v.dataset.mediaId&&Math.floor(v.currentTime)%10===0)saveProgress(v.dataset.mediaId,v.currentTime);});
document.querySelectorAll('.library-tab').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.library-tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');currentFilter=btn.dataset.filter;render();}));
document.getElementById('librarySearch').addEventListener('input',e=>{currentSearch=e.target.value.trim().toLowerCase();render();});
document.getElementById('refreshButton').addEventListener('click',load);
document.getElementById('scanButton').addEventListener('click',async()=>{const b=document.getElementById('scanButton');b.disabled=true;b.textContent='Scanning…';try{await fetch(`${base}/api/library/scan`,{method:'POST'});await load();}finally{b.disabled=false;b.textContent='↻ Scan library';}});
load();
</script>

{% elif page == 'detail' %}

<div class="site-background"></div>

<nav class="topbar detail-topbar">
    <div class="brand">
        <div class="brand-icon">🎬</div>
        <div class="brand-text">
            <strong>My Movie AI</strong>
            <span>your personal cinema</span>
        </div>
    </div>
    <a class="detail-back" href="{{ ingress_path|default('') }}/recommendations">← Back to picks</a>
</nav>

<main class="detail-page">
    <section class="detail-hero"{% if detail.backdrop %} style="--detail-backdrop: url('{{ detail.backdrop }}')"{% endif %}>
        <div class="detail-hero-overlay"></div>
        <div class="detail-hero-content">
            <div class="detail-poster-wrap">
                {% if detail.poster %}
                <img class="detail-poster" src="{{ detail.poster }}" alt="{{ detail.title }}">
                {% else %}
                <div class="detail-poster detail-poster-empty">🎬</div>
                {% endif %}
            </div>

            <div class="detail-main">
                <div class="detail-kicker">{{ "MOVIE" if media_type == "Movie" else "SERIES" }} • TMDB</div>
                <div class="detail-title-row">
                    <div>
                        <h1>{{ detail.title }}</h1>
                        {% if detail.tagline %}<p class="detail-tagline">{{ detail.tagline }}</p>{% endif %}
                    </div>
                    <div class="match-ring" style="--match-angle: {{ (detail.match_percentage / 100 * 360)|round(0) }}deg">
                        <strong>{{ detail.match_percentage }}%</strong>
                        <span>match</span>
                    </div>
                </div>

                <div class="detail-meta">
                    {% if detail.year %}<span>{{ detail.year }}</span>{% endif %}
                    <span class="detail-rating">★ {{ "%.1f"|format(detail.vote_average) }}</span>
                    {% if detail.status %}<span>{{ detail.status }}</span>{% endif %}
                    {% if detail.runtime %}<span>{{ detail.runtime }} min</span>{% endif %}
                    {% if detail.seasons %}<span>{{ detail.seasons }} seasons</span>{% endif %}
                </div>

                <div class="detail-genres">
                    {% for genre in detail.genres %}
                    <span>{{ genre }}</span>
                    {% endfor %}
                </div>

                <p class="detail-overview">{{ detail.overview or "No description available." }}</p>

                <div class="detail-actions">
                    {% if detail.is_watched %}
                    <div class="detail-watched-badge">✅ Already watched{% if detail.user_rating is not none %} • Your rating {{ "%.1f"|format(detail.user_rating) }}/10{% endif %}</div>
                    {% else %}
                    <form method="post" action="{{ ingress_path|default('') }}/recommendation/watched" class="detail-watched-form">
                        <input type="hidden" name="title" value="{{ detail.title }}">
                        <input type="hidden" name="media_type" value="{{ media_type }}">
                        <input type="hidden" name="tmdb_id" value="{{ detail.tmdb_id }}">
                        <input type="number" name="rating" min="0" max="10" step="0.1" value="8" required>
                        <button type="submit">✅ Mark watched</button>
                    </form>
                    {% endif %}

                    <form method="post" action="{{ ingress_path|default('') }}/watchlist/toggle">
                        <input type="hidden" name="tmdb_id" value="{{ detail.tmdb_id }}">
                        <input type="hidden" name="media_type" value="{{ media_type }}">
                        <input type="hidden" name="title" value="{{ detail.title }}">
                        <input type="hidden" name="year" value="{{ detail.year or '' }}">
                        <input type="hidden" name="poster" value="{{ detail.poster or '' }}">
                        <input type="hidden" name="backdrop" value="{{ detail.backdrop or '' }}">
                        <input type="hidden" name="overview" value="{{ detail.overview or '' }}">
                        <input type="hidden" name="vote_average" value="{{ detail.vote_average }}">
                        <input type="hidden" name="remove" value="{{ 'true' if detail.is_watchlisted else 'false' }}">
                        <button class="watchlist-button" type="submit">{{ "✓ In Watchlist" if detail.is_watchlisted else "+ Watchlist" }}</button>
                    </form>

                    <a class="tmdb-detail-button" href="{{ detail.tmdb_url }}" target="_blank" rel="noopener noreferrer">Open TMDB ↗</a>
                </div>

                <div class="why-detail">
                    <div class="why-detail-label">WHY YOU MAY LIKE IT</div>
                    <p>Based on your current library and ratings, this title is estimated at <strong>{{ detail.match_percentage }}% compatibility</strong> with your taste.</p>
                </div>

                {% if detail.director %}
                <div class="detail-director"><span>{{ "DIRECTOR" if media_type == "Movie" else "CREATED BY" }}</span><strong>{{ detail.director }}</strong></div>
                {% endif %}
            </div>
        </div>
    </section>

    {% if detail.cast %}
    <section class="detail-section">
        <div class="detail-section-heading"><h2>Cast</h2><span>{{ detail.cast|length }} featured</span></div>
        <div class="cast-rail">
            {% for person in detail.cast %}
            <div class="cast-card">
                {% if person.photo %}<img src="{{ person.photo }}" alt="{{ person.name }}">{% else %}<div class="cast-empty">👤</div>{% endif %}
                <strong>{{ person.name }}</strong>
                {% if person.character %}<span>{{ person.character }}</span>{% endif %}
            </div>
            {% endfor %}
        </div>
    </section>
    {% endif %}

    {% if detail.similar %}
    <section class="detail-section">
        <div class="detail-section-heading"><h2>More like this</h2><span>TMDB similar titles</span></div>
        <div class="similar-rail">
            {% for item in detail.similar %}
            <a class="similar-card" href="{{ ingress_path|default('') }}/title/{{ media_type }}/{{ item.tmdb_id }}">
                {% if item.poster %}<img src="{{ item.poster }}" alt="{{ item.title }}">{% endif %}
                <div class="similar-info">
                    <strong>{{ item.title }}</strong>
                    <span>{% if item.year %}{{ item.year }} • {% endif %}★ {{ "%.1f"|format(item.vote_average) }}</span>
                </div>
            </a>
            {% endfor %}
        </div>
    </section>
    {% endif %}
</main>

<script>
(function () {
    const base = document.body.dataset.ingressPath || "";
    document.querySelectorAll(".similar-card").forEach(function (card) {
        const href = card.getAttribute("href") || "";
        if (!href.startsWith("/app/") && base && href.startsWith("/title/")) {
            card.setAttribute("href", base + href);
        }
    });
})();
</script>

{% endif %}
</body>
</html>
