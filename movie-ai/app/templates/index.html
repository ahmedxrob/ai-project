<!-- ACTIONS -->

<div class="recommendation-actions">

    <!-- RECOMMEND ANOTHER -->

    <a
        href="/recommend/{{ 'movie' if recommendation.media_type == 'Movie' else 'series' }}"
        class="secondary-button"
    >
        🔄 Recommend another
    </a>


    <!-- OPEN EXACT TMDB PAGE -->

    {% if recommendation.tmdb_id %}

    <a
        href="https://www.themoviedb.org/{{ 'movie' if recommendation.media_type == 'Movie' else 'tv' }}/{{ recommendation.tmdb_id }}"
        target="_blank"
        rel="noopener noreferrer"
        class="secondary-button tmdb-button"
    >
        🎬 Open on TMDB
    </a>

    {% endif %}


    <!-- I ALREADY WATCHED THIS -->

    <form
        action="/recommendation/watched"
        method="post"
        class="watched-form"
    >

        <input
            type="hidden"
            name="title"
            value="{{ recommendation.tmdb_title }}"
        >

        <input
            type="hidden"
            name="media_type"
            value="{{ recommendation.media_type }}"
        >

        {% if recommendation.tmdb_id %}

        <input
            type="hidden"
            name="tmdb_id"
            value="{{ recommendation.tmdb_id }}"
        >

        {% endif %}


        <div class="watched-rating">

            <label>
                My rating
            </label>

            <input
                type="number"
                name="rating"
                min="0"
                max="10"
                step="0.1"
                value="8"
                required
            >

            <span>
                /10
            </span>

        </div>


        <button
            type="submit"
            class="watched-button"
        >
            ✅ I already watched this
        </button>

    </form>

</div>
