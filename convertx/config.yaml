name: ConvertX
version: "1.0.0"
slug: convertx
description: Self-hosted file converter supporting 1000+ formats
url: https://github.com/C4illin/ConvertX

arch:
  - amd64
  - aarch64

startup: application
boot: auto
init: false

ports:
  3000/tcp: 3001

ports_description:
  3000/tcp: ConvertX Web Interface

webui: http://[HOST]:[PORT:3001]

panel_icon: mdi:file-swap
panel_title: ConvertX

map:
  - type: data
    read_only: false

options:
  jwt_secret: ""
  account_registration: true
  auto_delete_every_n_hours: 24
  max_convert_process: 2
  language: en

schema:
  jwt_secret: password
  account_registration: bool
  auto_delete_every_n_hours: int
  max_convert_process: int
  language: str
